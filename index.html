<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>实时读屏翻译 · 滚动字幕</title>
<style>
:root{
  --bg:#0a0e14;
  --panel:#151b24;
  --line:#232c38;
  --text:#e8eef5;
  --muted:#8b98a8;
  --accent:#3ddc97;
  --accent2:#4aa8ff;
  --sub-font:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
button,input,select{font-family:inherit;font-size:14px;}

/* ---------- 视频层 ---------- */
#video{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;background:#000;z-index:1;
  transition:opacity .3s;
}
#video.hidden{opacity:0;pointer-events:none;}

/* ---------- 顶部状态 ---------- */
#statusBar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
  background:linear-gradient(180deg,rgba(6,10,16,.85),rgba(6,10,16,0));
  font-size:13px;color:#cfd8e3;pointer-events:none;
}
#statusBar > *{pointer-events:auto;}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none;transition:.2s;}
.dot.ok{background:var(--accent);box-shadow:0 0 9px var(--accent);}
.dot.busy{background:#f5a623;animation:pulse 1s infinite;}
.dot.err{background:#ff5c5c;box-shadow:0 0 9px #ff5c5c;}
@keyframes pulse{50%{opacity:.35;}}
#statusText{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000;}
#btnHideVideo{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  color:#cfd8e3;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;
  backdrop-filter:blur(6px);
}
#btnHideVideo:hover{background:rgba(255,255,255,.18);}

/* ---------- 字幕浮层 ---------- */
#subtitleBox{
  position:fixed;left:5%;top:58%;width:90%;height:30%;
  background:rgba(6,10,16,.72);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  padding:10px 14px 12px;
  z-index:40;
  display:flex;flex-direction:column;
  overflow:hidden;
  touch-action:none;
  backdrop-filter:blur(6px);
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  transition:background .15s;
  cursor:grab;
}
#subtitleBox:active{cursor:grabbing;}
#subtitleList{
  flex:1;display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden;gap:7px;
  padding:2px 1px;
  min-height:0;
}
.sub-item{
  flex:none;
  background:rgba(255,255,255,.07);
  border-left:3px solid var(--accent2);
  border-radius:8px;
  padding:6px 11px;
  animation:subIn .35s cubic-bezier(.2,.8,.3,1);
  word-break:break-word;
}
@keyframes subIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
.sub-orig{
  font-size:calc(var(--sub-font) * .6);
  line-height:1.35;color:rgba(255,255,255,.48);
  margin-bottom:2px;
  word-break:break-word;
}
.sub-trans{
  font-size:var(--sub-font);
  line-height:1.42;
  color:#fff;font-weight:600;
  letter-spacing:.2px;
  text-shadow:0 1px 4px rgba(0,0,0,.65);
}
.resize-handle{
  position:absolute;right:3px;bottom:3px;
  width:28px;height:28px;
  cursor:nwse-resize;
  border-radius:7px;
  opacity:.55;
  background:
    linear-gradient(135deg,transparent 46%,rgba(255,255,255,.65) 46%,rgba(255,255,255,.65) 54%,transparent 54%),
    linear-gradient(135deg,transparent 66%,rgba(255,255,255,.65) 66%,rgba(255,255,255,.65) 74%,transparent 74%);
  touch-action:none;
}
.resize-handle:hover{opacity:.9;}

/* ---------- 控制面板 ---------- */
#panelToggle{
  position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
  z-index:52;
  width:50px;height:50px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);
  color:var(--text);font-size:21px;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  transition:.2s;
}
#panelToggle:hover{border-color:var(--accent);transform:rotate(35deg);}

#panel{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:rgba(21,27,36,.96);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;
  transform:translateY(105%);
  transition:transform .3s cubic-bezier(.2,.8,.3,1);
  max-height:76vh;
  overflow-y:auto;
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 12px);
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
}
#panel.open{transform:none;}
.panel-head{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px 10px;
  position:sticky;top:0;background:rgba(21,27,36,.98);z-index:2;
  border-bottom:1px solid var(--line);
}
.panel-head h2{font-size:15px;margin:0;flex:1;letter-spacing:.5px;font-weight:600;}
.panel-head .close{
  background:transparent;border:none;color:var(--muted);font-size:22px;
  cursor:pointer;line-height:1;padding:0 4px;
}
.panel-body{padding:8px 18px 4px;}
.prow{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);
}
.prow:last-child{border-bottom:none;}
.prow > label{
  flex:none;width:82px;font-size:13.5px;color:var(--muted);
}
.prow select{
  flex:1;background:#0e131a;border:1px solid var(--line);
  color:var(--text);border-radius:8px;padding:8px 10px;outline:none;
}
.prow select:focus{border-color:var(--accent2);}
.prow input[type=range]{
  flex:1;accent-color:var(--accent);height:4px;
}
.prow .val{
  flex:none;width:46px;text-align:right;font-size:12.5px;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.prow .switch{
  flex:1;display:flex;gap:8px;
}
.prow .switch button{
  flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);
  background:#0e131a;color:var(--muted);cursor:pointer;transition:.15s;font-size:13.5px;
}
.prow .switch button.on{
  background:rgba(61,220,151,.14);border-color:var(--accent);color:var(--accent);
}
.action-row{
  display:flex;gap:10px;padding:14px 18px 6px;
  position:sticky;bottom:0;background:rgba(21,27,36,.98);
  border-top:1px solid var(--line);
}
.action-row button{
  flex:1;padding:12px;border-radius:11px;border:none;cursor:pointer;
  font-size:15px;font-weight:600;transition:.18s;
}
#btnToggleRun{background:var(--accent);color:#04140c;}
#btnToggleRun.stop{background:#ff5c5c;color:#fff;}
#btnClear{background:#0e131a;color:var(--muted);border:1px solid var(--line);flex:0 0 96px;}
#btnClear:hover{color:var(--text);}

/* ---------- 启动遮罩 ---------- */
#overlay{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(ellipse at 50% 30%,#16202e,#070a0f 70%);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
#overlay.hide{display:none;}
.overlay-card{
  max-width:420px;width:100%;text-align:center;
}
.overlay-card h1{
  font-size:25px;margin:0 0 10px;letter-spacing:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.overlay-card p{
  font-size:13.5px;color:var(--muted);line-height:1.85;margin:0 0 26px;
}
.overlay-card .big-btn{
  display:block;width:100%;padding:15px;border-radius:13px;border:none;
  font-size:15.5px;font-weight:600;cursor:pointer;margin-bottom:12px;
  transition:.18s;
}
.overlay-card .big-btn:hover{transform:translateY(-2px);}
#btnStartCam{background:linear-gradient(135deg,var(--accent),#22b47a);color:#04140c;
  box-shadow:0 10px 30px rgba(61,220,151,.28);}
#btnStartScreen{background:#182130;color:var(--text);border:1px solid var(--line);}
#btnStartScreen:hover{border-color:var(--accent2);}
.overlay-note{
  font-size:12px;color:#5c6878;margin-top:20px;line-height:1.8;
}
.overlay-note b{color:#8b98a8;font-weight:500;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:rgba(20,26,34,.97);border:1px solid var(--line);
  color:var(--text);padding:10px 22px;border-radius:999px;font-size:13.5px;
  opacity:0;transition:.28s;z-index:200;pointer-events:none;
  box-shadow:0 12px 34px rgba(0,0,0,.5);max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media(max-width:520px){
  .prow > label{width:70px;font-size:13px;}
}
</style>
</head>
<body>

<video id="video" playsinline webkit-playsinline muted autoplay></video>

<div id="statusBar">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">未启动</span>
  <button id="btnHideVideo">隐藏画面</button>
</div>

<div id="subtitleBox">
  <div id="subtitleList"></div>
  <div class="resize-handle" id="resizeHandle"></div>
</div>

<button id="panelToggle" title="设置">⚙</button>

<div id="panel">
  <div class="panel-head">
    <h2>实时字幕设置</h2>
    <button class="close" id="panelClose">×</button>
  </div>
  <div class="panel-body">
    <div class="prow">
      <label>识别语言</label>
      <select id="selOcrLang">
        <option value="eng">英文</option>
        <option value="chi_sim">中文</option>
        <option value="jpn">日文</option>
        <option value="kor">韩文</option>
        <option value="eng+chi_sim">中英混合</option>
      </select>
    </div>
    <div class="prow">
      <label>翻译成</label>
      <select id="selTgtLang">
        <option value="zh-CN">中文</option>
        <option value="en">英文</option>
        <option value="ja">日文</option>
        <option value="ko">韩文</option>
      </select>
    </div>
    <div class="prow">
      <label>识别间隔</label>
      <select id="selInterval">
        <option value="1500">1.5 秒</option>
        <option value="2500" selected>2.5 秒</option>
        <option value="4000">4 秒</option>
        <option value="6000">6 秒</option>
      </select>
    </div>
    <div class="prow">
      <label>识别区域</label>
      <select id="selRegion">
        <option value="full">整个画面</option>
        <option value="center">中央条带</option>
      </select>
    </div>
    <div class="prow">
      <label>显示原文</label>
      <div class="switch">
        <button id="btnOrigOn" class="on">显示</button>
        <button id="btnOrigOff">隐藏</button>
      </div>
    </div>
    <div class="prow">
      <label>字号</label>
      <input type="range" id="rngFont" min="14" max="46" value="22">
      <span class="val" id="valFont">22</span>
    </div>
    <div class="prow">
      <label>背景透明度</label>
      <input type="range" id="rngAlpha" min="0" max="100" value="72">
      <span class="val" id="valAlpha">72%</span>
    </div>
  </div>
  <div class="action-row">
    <button id="btnToggleRun">开始识别</button>
    <button id="btnClear">清空字幕</button>
  </div>
</div>

<div id="overlay">
  <div class="overlay-card">
    <h1>实时读屏翻译</h1>
    <p>用摄像头对准屏幕、菜单、路牌或书本，识别文字后自动翻译，并以字幕条叠加显示。</p>
    <button class="big-btn" id="btnStartCam">开启摄像头</button>
    <button class="big-btn" id="btnStartScreen">共享屏幕 / 窗口（桌面版）</button>
    <div class="overlay-note">
      <b>提示：</b>浏览器无法直接读取其他 App 的屏幕，手机端请用摄像头拍摄屏幕。<br>
      首次识别需加载 OCR 语言包（约 10–20 MB），请保持联网。
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* =========================================================
   工具
   ========================================================= */
const $ = (s, p = document) => p.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

/* =========================================================
   DOM
   ========================================================= */
const video = $('#video');
const statusDot = $('#statusDot');
const statusText = $('#statusText');
const subtitleBox = $('#subtitleBox');
const subtitleList = $('#subtitleList');
const panel = $('#panel');
const overlay = $('#overlay');

const selOcrLang = $('#selOcrLang');
const selTgtLang = $('#selTgtLang');
const selInterval = $('#selInterval');
const selRegion = $('#selRegion');
const rngFont = $('#rngFont');
const rngAlpha = $('#rngAlpha');
const valFont = $('#valFont');
const valAlpha = $('#valAlpha');
const btnToggleRun = $('#btnToggleRun');
const btnClear = $('#btnClear');
const btnOrigOn = $('#btnOrigOn');
const btnOrigOff = $('#btnOrigOff');

/* =========================================================
   状态
   ========================================================= */
let stream = null;
let isScreen = false;
let ocrWorker = null;
let workerLang = '';
let ocrLang = 'eng';
let tgtLang = 'zh-CN';
let running = false;
let busy = false;
let loopTimer = null;
let intervalMs = 2500;
let region = 'full';
let showOrig = true;
let lastText = '';

const LANG_MAP = { eng:'en', chi_sim:'zh-CN', jpn:'ja', kor:'ko', 'eng+chi_sim':'en' };

function setStatus(text, type){
  statusText.textContent = text;
  statusDot.className = 'dot ' + (type || '');
}

/* =========================================================
   媒体流
   ========================================================= */
async function startCamera(){
  stopStream();
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    isScreen = false;
    attachStream();
    return true;
  }catch(e){
    alert('无法访问摄像头：' + e.message + '\n\n请确认：\n1. 已允许摄像头权限\n2. 页面在 HTTPS 或 localhost 下打开\n3. 没有其他 App 占用摄像头');
    return false;
  }
}

async function startScreen(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    alert('当前浏览器不支持屏幕共享。\n请使用桌面版 Chrome / Edge，并在 HTTPS 下打开。');
    return false;
  }
  stopStream();
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    isScreen = true;
    attachStream();
    return true;
  }catch(e){
    return false;
  }
}

function attachStream(){
  video.srcObject = stream;
  video.style.objectFit = isScreen ? 'contain' : 'cover';
  video.play().catch(() => {});
  stream.getVideoTracks()[0].addEventListener('ended', () => {
    stopRun();
    setStatus('视频源已断开', 'err');
  });
}

function stopStream(){
  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
}

/* =========================================================
   OCR
   ========================================================= */
async function ensureWorker(){
  if(ocrWorker && workerLang === ocrLang) return ocrWorker;
  if(ocrWorker){
    try{ await ocrWorker.terminate(); }catch(e){}
    ocrWorker = null;
    workerLang = '';
  }
  setStatus('加载 OCR 引擎…', 'busy');
  ocrWorker = await Tesseract.createWorker(ocrLang, 1, {
    langPath: 'https://tessdata.projectnaptha.com/4.0.0',
    logger: m => {
      if(m.progress != null && m.progress < 1 && m.status &&
         (m.status.includes('loading') || m.status.includes('initializ'))){
        setStatus('加载 OCR 引擎 ' + Math.round(m.progress * 100) + '%', 'busy');
      }
    }
  });
  workerLang = ocrLang;
  return ocrWorker;
}

/* =========================================================
   翻译（Google 主 + MyMemory 备）
   ========================================================= */
async function translateOne(text, to){
  // 主通道
  try{
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
      encodeURIComponent(to) + '&dt=t&q=' + encodeURIComponent(text);
    const r = await fetch(url);
    if(r.ok){
      const d = await r.json();
      if(d && d[0]) return d[0].map(x => x[0]).join('');
    }
  }catch(e){}

  // 备用通道
  try{
    const from = LANG_MAP[ocrLang] || 'en';
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
      '&langpair=' + from + '|' + to;
    const r = await fetch(url);
    const d = await r.json();
    if(d && d.responseData && d.responseData.translatedText){
      return d.responseData.translatedText;
    }
  }catch(e){}

  return '';
}

async function translateText(text, to){
  text = text.trim();
  if(!text) return '';
  if(text.length > 900) text = text.slice(0, 900);

  // 按句切分，避免单次请求过长
  const parts = text.replace(/([.?!。？！；;])\s*/g, '$1\n').split('\n')
    .map(s => s.trim()).filter(Boolean);
  const chunks = [];
  let cur = '';
  for(const p of parts){
    if((cur + p).length > 380){
      if(cur) chunks.push(cur);
      cur = p;
    }else{
      cur += p;
    }
  }
  if(cur) chunks.push(cur);
  if(!chunks.length) chunks.push(text);

  const out = [];
  for(const c of chunks){
    const t = await translateOne(c, to);
    if(t) out.push(t);
  }
  return out.join('');
}

/* =========================================================
   字幕渲染
   ========================================================= */
function addSubtitle(orig, trans){
  const item = document.createElement('div');
  item.className = 'sub-item';
  const o = showOrig ? `<div class="sub-orig">${esc(orig)}</div>` : '';
  item.innerHTML = o + `<div class="sub-trans">${esc(trans)}</div>`;
  subtitleList.appendChild(item);
  while(subtitleList.children.length > 10){
    subtitleList.removeChild(subtitleList.firstChild);
  }
}

/* =========================================================
   抓帧 / 文本清理 / 去重
   ========================================================= */
function captureFrame(){
  if(!video.videoWidth || !video.videoHeight) return null;
  let sx = 0, sy = 0, sw = video.videoWidth, sh = video.videoHeight;
  if(region === 'center'){
    sy = sh * 0.30;
    sh = sh * 0.40;
  }
  const maxW = 1280;
  const scale = Math.min(1, maxW / sw);
  const c = document.createElement('canvas');
  c.width = Math.round(sw * scale);
  c.height = Math.round(sh * scale);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

function cleanText(t){
  return String(t)
    .replace(/\r/g, '')
    .replace(/[ \t]+/g, ' ')
    .replace(/\n{2,}/g, '\n')
    .trim();
}

function isGarbage(t){
  if(t.length < 2) return true;
  const letters = (t.match(/[\p{L}\p{N}]/gu) || []).length;
  return letters / t.length < 0.3;
}

function similar(a, b){
  if(!a || !b) return false;
  if(a === b) return true;
  const s = a.length < b.length ? a : b;
  const l = a.length < b.length ? b : a;
  return l.includes(s) && s.length / l.length > 0.65;
}

/* =========================================================
   主循环
   ========================================================= */
function schedule(){
  if(!running) return;
  clearTimeout(loopTimer);
  loopTimer = setTimeout(tick, intervalMs);
}

async function tick(){
  if(!running) return;
  if(busy){ schedule(); return; }
  if(!stream){ setStatus('视频源未连接', 'err'); stopRun(); return; }

  busy = true;
  try{
    const canvas = captureFrame();
    if(!canvas){ busy = false; schedule(); return; }

    if(!ocrWorker || workerLang !== ocrLang){
      setStatus('准备 OCR 引擎…', 'busy');
      await ensureWorker();
    }

    setStatus('识别中…', 'busy');
    const { data } = await ocrWorker.recognize(canvas);
    const text = cleanText(data.text || '');

    if(text && !isGarbage(text) && !similar(text, lastText)){
      lastText = text;
      setStatus('翻译中…', 'busy');
      const trans = await translateText(text, tgtLang);
      if(trans){
        addSubtitle(text, trans);
        setStatus('运行中', 'ok');
      }else{
        setStatus('翻译失败，请检查网络', 'err');
      }
    }else{
      setStatus('运行中', 'ok');
    }
  }catch(e){
    console.error(e);
    setStatus('出错：' + (e.message || e), 'err');
  }
  busy = false;
  schedule();
}

async function startRun(){
  if(running) return;
  if(!stream){ toast('请先选择视频源'); return; }
  try{
    await ensureWorker();
  }catch(e){
    alert('OCR 引擎加载失败：' + e.message + '\n\n请检查网络后重试。');
    return;
  }
  running = true;
  lastText = '';
  btnToggleRun.textContent = '停止识别';
  btnToggleRun.classList.add('stop');
  setStatus('运行中', 'ok');
  schedule();
}

function stopRun(){
  running = false;
  busy = false;
  clearTimeout(loopTimer);
  btnToggleRun.textContent = '开始识别';
  btnToggleRun.classList.remove('stop');
  setStatus('已停止', '');
}

/* =========================================================
   字幕框：拖拽 + 缩放 + 持久化
   ========================================================= */
let dragMode = null;
let dragStart = {};

subtitleBox.addEventListener('pointerdown', e => {
  dragMode = e.target.classList.contains('resize-handle') ? 'resize' : 'drag';
  const r = subtitleBox.getBoundingClientRect();
  dragStart = {
    x: e.clientX, y: e.clientY,
    left: r.left, top: r.top,
    w: r.width, h: r.height
  };
  try{ subtitleBox.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});

subtitleBox.addEventListener('pointermove', e => {
  if(!dragMode) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;

  if(dragMode === 'drag'){
    const left = Math.max(-dragStart.w * 0.6,
      Math.min(window.innerWidth - dragStart.w * 0.4, dragStart.left + dx));
    const top = Math.max(0, Math.min(window.innerHeight - 44, dragStart.top + dy));
    subtitleBox.style.left = left + 'px';
    subtitleBox.style.top = top + 'px';
  }else{
    const w = Math.max(160, Math.min(window.innerWidth, dragStart.w + dx));
    const h = Math.max(80, Math.min(window.innerHeight * 0.9, dragStart.h + dy));
    subtitleBox.style.width = w + 'px';
    subtitleBox.style.height = h + 'px';
  }
});

function endDrag(e){
  if(!dragMode) return;
  dragMode = null;
  try{ subtitleBox.releasePointerCapture(e.pointerId); }catch(err){}
  saveLayout();
}
subtitleBox.addEventListener('pointerup', endDrag);
subtitleBox.addEventListener('pointercancel', endDrag);

function applyFont(v){
  document.documentElement.style.setProperty('--sub-font', v + 'px');
  valFont.textContent = v;
}
function applyAlpha(v){
  subtitleBox.style.background = 'rgba(6,10,16,' + (v / 100) + ')';
  valAlpha.textContent = v + '%';
}

function saveLayout(){
  try{
    localStorage.setItem('moge_sub_layout', JSON.stringify({
      left: subtitleBox.style.left,
      top: subtitleBox.style.top,
      width: subtitleBox.style.width,
      height: subtitleBox.style.height,
      font: rngFont.value,
      alpha: rngAlpha.value
    }));
  }catch(e){}
}
function loadLayout(){
  try{
    const raw = localStorage.getItem('moge_sub_layout');
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.left) subtitleBox.style.left = d.left;
    if(d.top) subtitleBox.style.top = d.top;
    if(d.width) subtitleBox.style.width = d.width;
    if(d.height) subtitleBox.style.height = d.height;
    if(d.font){ rngFont.value = d.font; applyFont(d.font); }
    if(d.alpha){ rngAlpha.value = d.alpha; applyAlpha(d.alpha); }
  }catch(e){}
}

/* =========================================================
   事件绑定
   ========================================================= */
$('#btnStartCam').addEventListener('click', async () => {
  if(await startCamera()){
    overlay.classList.add('hide');
    startRun();
  }
});

$('#btnStartScreen').addEventListener('click', async () => {
  if(await startScreen()){
    overlay.classList.add('hide');
    startRun();
  }
});

$('#btnHideVideo').addEventListener('click', () => {
  video.classList.toggle('hidden');
  $('#btnHideVideo').textContent = video.classList.contains('hidden') ? '显示画面' : '隐藏画面';
});

$('#panelToggle').addEventListener('click', () => panel.classList.toggle('open'));
$('#panelClose').addEventListener('click', () => panel.classList.remove('open'));

btnToggleRun.addEventListener('click', () => {
  if(running) stopRun();
  else startRun();
});

btnClear.addEventListener('click', () => {
  subtitleList.innerHTML = '';
  lastText = '';
  toast('字幕已清空');
});

selOcrLang.addEventListener('change', async () => {
  ocrLang = selOcrLang.value;
  lastText = '';
  if(ocrWorker){
    const old = ocrWorker;
    ocrWorker = null;
    workerLang = '';
    try{ await old.terminate(); }catch(e){}
  }
  if(running) setStatus('切换识别语言，准备重建引擎…', 'busy');
  toast('识别语言已切换');
});

selTgtLang.addEventListener('change', () => {
  tgtLang = selTgtLang.value;
  lastText = '';
  toast('翻译目标已切换');
});

selInterval.addEventListener('change', () => {
  intervalMs = parseInt(selInterval.value, 10);
  if(running) schedule();
});

selRegion.addEventListener('change', () => {
  region = selRegion.value;
});

btnOrigOn.addEventListener('click', () => {
  showOrig = true;
  btnOrigOn.classList.add('on');
  btnOrigOff.classList.remove('on');
  subtitleList.querySelectorAll('.sub-orig').forEach(el => el.style.display = '');
});

btnOrigOff.addEventListener('click', () => {
  showOrig = false;
  btnOrigOff.classList.add('on');
  btnOrigOn.classList.remove('on');
  subtitleList.querySelectorAll('.sub-orig').forEach(el => el.style.display = 'none');
});

rngFont.addEventListener('input', () => {
  applyFont(rngFont.value);
  saveLayout();
});

rngAlpha.addEventListener('input', () => {
  applyAlpha(rngAlpha.value);
  saveLayout();
});

window.addEventListener('resize', () => {
  const r = subtitleBox.getBoundingClientRect();
  if(r.left > window.innerWidth - 80) subtitleBox.style.left = (window.innerWidth - 120) + 'px';
  if(r.top > window.innerHeight - 60) subtitleBox.style.top = (window.innerHeight - 120) + 'px';
});

/* =========================================================
   启动
   ========================================================= */
loadLayout();
applyFont(rngFont.value);
applyAlpha(rngAlpha.value);

if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  setStatus('当前环境不支持摄像头', 'err');
}
</script>
</body>
</html>
